  --felt:#1b5d43; --felt-2:#174f39; --grid:#0a2a1e; --frame:#4a321f; --frame-2:#2e1f13;
  --accent:#d6a64c; --warn:#ef6b5a; --hint:rgba(255,255,255,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b211e; --ink:#e7ebe6; --muted:#9aa59d; --line:#2c3530;
  --felt:#1b5d43; --felt-2:#174f39; --grid:#0a2a1e; --frame:#4a321f; --frame-2:#2e1f13;
  --accent:#d6a64c; --warn:#ef6b5a; --hint:rgba(255,255,255,.22); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.06em;text-wrap:balance}
h1 small{font-family:var(--font-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.08em;margin-left:10px}
.status{font-weight:700;font-size:15px;min-height:1.6em}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:1fr}}

/* board */
.boardbox{min-width:0;display:flex;justify-content:center}
.frame{width:min(100%,600px);background:linear-gradient(160deg,var(--frame),var(--frame-2));border-radius:10px;padding:clamp(18px,4%,28px);box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative}
.coords{position:absolute;font-family:var(--font-mono);font-size:11px;color:#e8d5b5;opacity:.85;display:grid;pointer-events:none}
.coords.top{left:clamp(18px,4%,28px);right:clamp(18px,4%,28px);top:0;height:clamp(18px,4%,28px);grid-template-columns:repeat(8,1fr);place-items:center}
.coords.left{top:clamp(18px,4%,28px);bottom:clamp(18px,4%,28px);left:0;width:clamp(18px,4%,28px);grid-template-rows:repeat(8,1fr);place-items:center}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;max-width:100%;background:var(--grid);gap:2px;padding:2px;border-radius:3px;position:relative}
.cell{appearance:none;border:0;padding:0;margin:0;background:radial-gradient(circle at 50% 40%,var(--felt),var(--felt-2));position:relative;cursor:default;display:block;min-width:0;min-height:0;overflow:hidden;font-size:0}
.cell .disc,.cell .dot,.last::after{position:absolute;inset:0;margin:auto}
.cell .disc{width:88%;height:88%}
.cell.legal{cursor:pointer}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.dot{width:24%;height:24%;border-radius:50%;background:var(--hint);transition:transform .15s}
.cell.legal:hover .dot{transform:scale(1.5)}
.disc{width:82%;aspect-ratio:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.disc.b{background:var(--img-b) center/contain no-repeat}
.disc.w{background:var(--img-w) center/contain no-repeat}
.disc.flip{animation:flip .38s ease}
.disc.place{animation:place .22s ease-out}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
@keyframes place{0%{transform:scale(.4);opacity:.3}100%{transform:scale(1);opacity:1}}
.last::after{content:"";width:12%;height:12%;z-index:1;border-radius:50%;background:var(--accent)}
.star{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--grid);transform:translate(-50%,-50%);pointer-events:none;z-index:1}
@media (prefers-reduced-motion:reduce){.disc.flip,.disc.place{animation:none}}

/* side */
aside{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px}
.label{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:2px solid transparent;transition:border-color .2s}
.side.turn{border-color:var(--accent)}
.side .disc{width:38px;flex:none}
.side .who{white-space:nowrap}
.side{padding:10px 8px;gap:8px;min-width:0}
.side .n{font-family:var(--font-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.side .who{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--disc-w);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--disc-b);transition:width .3s}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1d1408;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.log{font-family:var(--font-mono);font-size:12.5px;display:grid;grid-template-columns:2.2em 1fr 1fr;gap:2px 8px;max-height:180px;overflow:auto;font-variant-numeric:tabular-nums;color:var(--ink)}
.log .num{color:var(--muted)}
.log .empty{grid-column:1/-1;color:var(--muted);font-family:var(--font-body)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,20,15,.88);color:#f4f2ea;padding:12px 20px;border-radius:8px;font-weight:700;text-align:center;pointer-events:none;z-index:5;max-width:85%;width:max-content;font-size:14px;line-height:1.5}
.result{font-family:var(--font-display);font-size:22px}
.timer{display:grid;gap:6px}
.timer[hidden]{display:none!important}
.timer .t{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.timer .sec{font-family:var(--font-mono);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.timer .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer .track i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.timer.warn .sec{color:var(--warn)}
.timer.warn .track i{background:var(--warn)}
@media (prefers-reduced-motion:no-preference){.timer.warn .sec{animation:pulse .5s ease-in-out infinite alternate}}
@keyframes pulse{to{opacity:.45}}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="/">← アプリ一覧に戻る</a>
  <header>
    <h1>リバーシ<small>8×8・鬼が先手</small></h1>
    <div class="status" id="status" aria-live="polite"></div>
  </header>
  <div class="main">
    <div class="boardbox">
      <div class="frame">
        <div class="coords top" id="ctop"></div>
        <div class="coords left" id="cleft"></div>
        <div class="board" id="board" role="grid" aria-label="リバーシの盤面"></div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <aside>
      <section class="panel">
        <div class="score">
          <div class="side" id="sideB"><div class="disc b"></div><div><div class="n" id="nB">2</div><div class="who" id="whoB">鬼</div></div></div>
          <div class="side" id="sideW"><div class="disc w"></div><div><div class="n" id="nW">2</div><div class="who" id="whoW">福</div></div></div>
        </div>
        <div class="bar" aria-hidden="true"><i id="barB" style="width:50%"></i></div>
        <div class="timer" id="timer" hidden>
          <div class="t"><span id="timerWho">鬼の持ち時間</span><span><span class="sec" id="timerSec">30</span> 秒</span></div>
          <div class="track" aria-hidden="true"><i id="timerBar"></i></div>
        </div>
      </section>
      <section class="panel">
        <div class="label">対戦モード</div>
        <div class="seg" id="modeSeg">
          <button id="m-cpuB" data-mode="cpuB" aria-pressed="true">CPU戦（あなたが鬼）</button>
          <button id="m-cpuW" data-mode="cpuW" aria-pressed="false">CPU戦（あなたが福）</button>
          <button id="m-pvp" data-mode="pvp" aria-pressed="false">2人で対戦</button>
        </div>
        <div class="label">CPUの強さ</div>
        <div class="seg" id="lvSeg">
          <button id="lv1" data-lv="1" aria-pressed="false">やさしい</button>
          <button id="lv2" data-lv="2" aria-pressed="true">ふつう</button>
          <button id="lv3" data-lv="3" aria-pressed="false">つよい</button>
        </div>
        <div class="label">1手の制限時間</div>
        <div class="seg" id="limSeg">
          <button id="lim0" data-lim="0" aria-pressed="true">なし</button>
          <button id="lim10" data-lim="10" aria-pressed="false">10秒</button>
          <button id="lim20" data-lim="20" aria-pressed="false">20秒</button>
          <button id="lim30" data-lim="30" aria-pressed="false">30秒</button>
          <button id="lim60" data-lim="60" aria-pressed="false">60秒</button>
        </div>
        <label class="toggle"><input type="checkbox" id="hints" checked> 置ける場所を表示</label>
        <div class="row">
          <button class="btn primary" id="newBtn">新しく始める</button>
          <button class="btn" id="undoBtn">待った</button>
        </div>
      </section>
      <section class="panel">
        <div class="label">棋譜</div>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </div>
</div>

<script>
(()=>{
const B=1,W=2,DIRS=[-9,-8,-7,-1,1,7,8,9];
const COLS="abcdefgh";
const WEIGHTS=[
 120,-20,20,5,5,20,-20,120,
 -20,-40,-5,-5,-5,-5,-40,-20,
 20,-5,15,3,3,15,-5,20,
 5,-5,3,3,3,3,-5,5,
 5,-5,3,3,3,3,-5,5,
 20,-5,15,3,3,15,-5,20,
 -20,-40,-5,-5,-5,-5,-40,-20,
 120,-20,20,5,5,20,-20,120];
const $=id=>document.getElementById(id);
const boardEl=$("board");

let settings={mode:"cpuB",lv:2,hints:true,limit:0};
try{const s=JSON.parse(localStorage.getItem("reversi-settings")||"null");if(s)settings={...settings,...s}}catch(e){}
function saveSettings(){try{localStorage.setItem("reversi-settings",JSON.stringify(settings))}catch(e){}}

let S, history=[], busy=false, cpuTimer=null;

function initial(){
  const b=new Array(64).fill(0);
  b[27]=W;b[28]=B;b[35]=B;b[36]=W;
  return {board:b,turn:B,last:-1,log:[],over:false};
}
function flipsFor(b,i,p){
  if(b[i])return [];
  const o=3-p,r=Math.floor(i/8),c=i%8,res=[];
  for(const d of DIRS){
    let rr=r+(d<=-7?-1:d>=7?1:0), cc=c+(d===-9||d===-1||d===7?-1:d===-7||d===1||d===9?1:0);
    const sr=rr-r, sc=cc-c, line=[];
    while(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===o){line.push(rr*8+cc);rr+=sr;cc+=sc}
    if(line.length&&rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]===p)res.push(...line);
  }
  return res;
}
function legal(b,p){const m=[];for(let i=0;i<64;i++)if(!b[i]&&flipsFor(b,i,p).length)m.push(i);return m}
function count(b){let x=0,y=0;for(const v of b){if(v===B)x++;else if(v===W)y++}return [x,y]}
function name(i){return COLS[i%8]+(Math.floor(i/8)+1)}
function pName(p){return p===B?"鬼":"福"}
function isCpu(p){return (settings.mode==="cpuB"&&p===W)||(settings.mode==="cpuW"&&p===B)}

/* AI */
function evaluate(b,p){
  const o=3-p;let s=0,empties=0;
  for(let i=0;i<64;i++){if(b[i]===p)s+=WEIGHTS[i];else if(b[i]===o)s-=WEIGHTS[i];else empties++}
  const mp=legal(b,p).length,mo=legal(b,o).length;
  s+=(mp-mo)*(empties>20?8:4);
  if(empties<12){const [x,y]=count(b);s+=(p===B?x-y:y-x)*3}
  return s;
}
function apply(b,i,p){const nb=b.slice(),f=flipsFor(b,i,p);nb[i]=p;for(const j of f)nb[j]=p;return nb}
function negamax(b,p,depth,alpha,beta,exact){
  const moves=legal(b,p);
  if(depth===0&&!exact)return evaluate(b,p);
  if(!moves.length){
    if(!legal(b,3-p).length){const [x,y]=count(b);const d=p===B?x-y:y-x;return d*1000}
    return -negamax(b,3-p,depth,-beta,-alpha,exact);
  }
  moves.sort((a,c)=>WEIGHTS[c]-WEIGHTS[a]);
  let best=-Infinity;
  for(const m of moves){
    const v=-negamax(apply(b,m,p),3-p,Math.max(0,depth-1),-beta,-alpha,exact);
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return best;
}
function cpuMove(b,p,lv){
  const moves=legal(b,p);if(!moves.length)return -1;
  if(lv===1){
    // 角は取るが、あとは軽く重み付けしたランダム
    const scored=moves.map(m=>({m,s:WEIGHTS[m]+flipsFor(b,m,p).length*2+Math.random()*60}));
    scored.sort((a,c)=>c.s-a.s);return scored[0].m;
  }
  const empties=b.filter(v=>!v).length;
  const exact=lv===3&&empties<=10;
  const depth=lv===2?2:5;
  let best=moves[0],bv=-Infinity;
  const ordered=moves.slice().sort((a,c)=>WEIGHTS[c]-WEIGHTS[a]);
  for(const m of ordered){
    const v=-negamax(apply(b,m,p),3-p,depth-1,-Infinity,-bv,exact)+(lv===2?Math.random()*6:0);
    if(v>bv){bv=v;best=m}
  }
  return best;
}

/* UI */
function buildBoard(){
  boardEl.innerHTML="";
  for(let i=0;i<64;i++){
    const c=document.createElement("button");
    c.className="cell";c.id="c"+i;c.dataset.i=i;c.setAttribute("role","gridcell");
    c.addEventListener("click",()=>humanMove(i));
    boardEl.appendChild(c);
  }
  for(const [x,y] of [[2,2],[6,2],[2,6],[6,6]]){
    const s=document.createElement("div");s.className="star";s.style.left=(x*12.5)+"%";s.style.top=(y*12.5)+"%";boardEl.appendChild(s);
  }
  $("ctop").innerHTML=[...COLS].map(c=>`<span>${c}</span>`).join("");
  $("cleft").innerHTML=[1,2,3,4,5,6,7,8].map(n=>`<span>${n}</span>`).join("");
}
function render(placed=-1,flipped=[]){
  const b=S.board,moves=S.over?[]:legal(b,S.turn);
  const showHints=settings.hints&&!isCpu(S.turn)&&!S.over;
  for(let i=0;i<64;i++){
    const c=$("c"+i),v=b[i],isLegal=moves.includes(i)&&!isCpu(S.turn);
    c.classList.toggle("legal",isLegal);
    c.classList.toggle("last",i===S.last);
    c.disabled=!isLegal;
    const label=name(i)+(v?`（${pName(v)}）`:isLegal?"（置ける）":"");
    c.setAttribute("aria-label",label);
    let html="";
    if(v)html=`<div class="disc ${v===B?"b":"w"}${i===placed?" place":flipped.includes(i)?" flip":""}"></div>`;
    else if(isLegal&&showHints)html=`<div class="dot"></div>`;
    c.innerHTML=html;
  }
  const [x,y]=count(b);
  $("nB").textContent=x;$("nW").textContent=y;
  $("barB").style.width=(x/(x+y)*100)+"%";
  $("sideB").classList.toggle("turn",!S.over&&S.turn===B);
  $("sideW").classList.toggle("turn",!S.over&&S.turn===W);
  const lb=settings.mode==="pvp"?"鬼":settings.mode==="cpuB"?"鬼（あなた）":"鬼（CPU）";
  const lw=settings.mode==="pvp"?"福":settings.mode==="cpuW"?"福（あなた）":"福（CPU）";
  $("whoB").textContent=lb;$("whoW").textContent=lw;
  let st;
  if(S.over){
    st=x===y?`引き分け（${x}対${y}）`:`${x>y?"鬼":"福"}の勝ち（${Math.max(x,y)}対${Math.min(x,y)}）`;
    if(settings.mode!=="pvp"&&x!==y){const me=settings.mode==="cpuB"?B:W;st+=((x>y?B:W)===me)?" あなたの勝ちです":" CPUの勝ちです"}
  }else st=isCpu(S.turn)?`${pName(S.turn)}（CPU）が考えています…`:`${pName(S.turn)}の番です`;
  $("status").innerHTML=S.over?`<span class="result">${st}</span>`:st;
  // log
  const L=S.log;let lh="";
  if(!L.length)lh=`<div class="empty">まだ手がありません。鬼から打ちます。</div>`;
  let n=1;for(let k=0;k<L.length;k++){
    const e=L[k];
    if(e.p===B){lh+=`<span class="num">${n}.</span><span>${e.t}</span>`;const nx=L[k+1];if(nx&&nx.p===W){lh+=`<span>${nx.t}</span>`;k++}else lh+=`<span></span>`}
    else lh+=`<span class="num">${n}.</span><span>—</span><span>${e.t}</span>`;
    n++;
  }
  $("log").innerHTML=lh;$("log").scrollTop=1e6;
  $("undoBtn").disabled=!history.length||busy;
}
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1400)}

/* 1手の制限時間（人間の手番のみ。CPUには適用しない） */
let tInt=null,tDeadline=0;
function stopTimer(){clearInterval(tInt);tInt=null}
function armTimer(){
  stopTimer();
  const el=$("timer"),lim=settings.limit;
  if(!lim||S.over){el.hidden=true;return}
  el.hidden=false;
  if(isCpu(S.turn)){
    $("timerWho").textContent=`${pName(S.turn)}（CPU）の手番`;$("timerSec").textContent="–";
    $("timerBar").style.width="100%";el.classList.remove("warn");return;
  }
  $("timerWho").textContent=`${pName(S.turn)}の持ち時間`;
  tDeadline=performance.now()+lim*1000;
  const tick=()=>{
    const left=Math.max(0,tDeadline-performance.now());
    $("timerSec").textContent=Math.ceil(left/1000);
    $("timerBar").style.width=(left/(lim*1000)*100)+"%";
    el.classList.toggle("warn",left<=5000);
    if(left<=0){stopTimer();timeUp()}
  };
  tick();tInt=setInterval(tick,100);
}
function timeUp(){
  if(S.over||isCpu(S.turn))return;
  const moves=legal(S.board,S.turn);if(!moves.length)return;
  const who=pName(S.turn),m=moves[Math.floor(Math.random()*moves.length)];
  play(m);
  toast(`${who}は時間切れ：${name(m)}に自動で打ちました`);
}

function play(i){
  const f=flipsFor(S.board,i,S.turn);if(!f.length)return false;
  stopTimer();
  history.push(JSON.parse(JSON.stringify(S)));
  S.board=apply(S.board,i,S.turn);S.last=i;S.log.push({p:S.turn,t:name(i)});
  S.turn=3-S.turn;
  advance(i,f);
  return true;
}
function advance(placed,flipped){
  if(!legal(S.board,S.turn).length){
    if(!legal(S.board,3-S.turn).length){S.over=true;render(placed,flipped);armTimer();return}
    const passer=S.turn;S.log.push({p:passer,t:"パス"});S.turn=3-S.turn;
    render(placed,flipped);toast(`${pName(passer)}は置ける場所がないのでパスです`);
  }else render(placed,flipped);
  armTimer();
  scheduleCpu();
}
function scheduleCpu(){
  clearTimeout(cpuTimer);
  if(S.over||!isCpu(S.turn))return;
  busy=true;$("undoBtn").disabled=true;
  cpuTimer=setTimeout(()=>{
    const m=cpuMove(S.board,S.turn,settings.lv);busy=false;
    if(m>=0)play(m);
  },settings.lv===3?250:500);
}
function humanMove(i){if(busy||S.over||isCpu(S.turn))return;play(i)}
function newGame(){clearTimeout(cpuTimer);busy=false;S=initial();history=[];render();armTimer();scheduleCpu()}
function undo(){
  if(busy||!history.length)return;clearTimeout(cpuTimer);
  let prev=history.pop();
  while(isCpu(prev.turn)&&history.length)prev=history.pop();
  S=prev;render();armTimer();
  if(isCpu(S.turn))scheduleCpu();
}
function syncSeg(){
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===settings.mode));
  document.querySelectorAll("#lvSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===settings.lv));
  $("lvSeg").style.opacity=settings.mode==="pvp"?.45:1;
  document.querySelectorAll("#limSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lim===settings.limit));
  $("hints").checked=settings.hints;
}
$("limSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;settings.limit=+b.dataset.lim;saveSettings();syncSeg();armTimer()});
$("modeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;settings.mode=b.dataset.mode;saveSettings();syncSeg();newGame()});
$("lvSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;settings.lv=+b.dataset.lv;saveSettings();syncSeg();render()});
$("hints").addEventListener("change",e=>{settings.hints=e.target.checked;saveSettings();render()});
$("newBtn").addEventListener("click",newGame);
$("undoBtn").addEventListener("click",undo);

function start(data){
  buildBoard();syncSeg();
  if(data&&data.S){S=data.S;history=data.history||[];render();armTimer();scheduleCpu()}else newGame();
}
window.claude?.hot?.snapshot?.(()=>({S,history}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

</body>
