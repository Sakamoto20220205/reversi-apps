<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="鬼と福のリバーシ、きのこ派vsたけのこ派リバーシ。ブラウザですぐ遊べるリバーシ集。">
<title>リバーシ遊技場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: 盤面の目盛りを背景に、2つのゲームを石のペアで見分けるカード2枚 */
:root{
  --bg:#eef0ea; --surface:#fbfcf8; --ink:#1f2420; --muted:#626b64; --line:#d6dbd2;
  --felt:#1e6a4c; --biscuit:#f0d8a6; --frame:#4a2a17; --accent:#c8553d;
  --font-display:"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121513;--surface:#1b201d;--ink:#e9ece7;--muted:#9ea79f;--line:#2c332e;--accent:#e57a5f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121513;--surface:#1b201d;--ink:#e9ece7;--muted:#9ea79f;--line:#2c332e;--accent:#e57a5f;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:48px 56px;display:grid;gap:28px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:.04em;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:40em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.card{display:grid;grid-template-rows:auto 1fr;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px;aspect-ratio:2/1;max-width:100%}
.stage.oni{background:#0f3d2b} .stage.kino{background:#6b3f22}
.sq{position:relative}
.stage.oni .sq{background:radial-gradient(circle at 50% 40%,#1e6a4c,#195a40)}
.stage.kino .sq{background:radial-gradient(circle at 50% 40%,#f0d8a6,#e3c287)}
.sq i{position:absolute;inset:8%;background-position:center;background-size:contain;background-repeat:no-repeat;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.body{padding:18px 20px 20px;display:grid;gap:8px;align-content:start}
.body h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0}
.body p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.go{margin-top:8px;font-weight:700;color:var(--accent)}
footer{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>リバーシ遊技場</h1>
    <p class="lead">ブラウザですぐ遊べるリバーシを2つ用意しました。遊びたい盤を選んでください。</p>
  </header>
  <div class="grid">
    <a class="card" href="/oni-fuku">
      <div class="stage oni" aria-hidden="true">
        <div class="sq"></div><div class="sq"><i style="background-image:url(/assets/oni.png)"></i></div><div class="sq"><i style="background-image:url(/assets/fuku.png)"></i></div><div class="sq"></div>
        <div class="sq"></div><div class="sq"><i style="background-image:url(/assets/fuku.png)"></i></div><div class="sq"><i style="background-image:url(/assets/oni.png)"></i></div><div class="sq"></div>
      </div>
      <div class="body">
        <h2>鬼と福のリバーシ</h2>
        <p>鬼と福の顔が石になった、緑の盤のリバーシ。8×8の基本ルールで遊べます。</p>
        <div class="tags"><span>CPU戦 3段階</span><span>2人対戦</span><span>持ち時間</span><span>棋譜</span></div>
        <span class="go">この盤で遊ぶ →</span>
      </div>
    </a>
    <a class="card" href="/kinoko-takenoko">
      <div class="stage kino" aria-hidden="true">
        <div class="sq"></div><div class="sq"><i style="background-image:url(/assets/kinoko.svg)"></i></div><div class="sq"><i style="background-image:url(/assets/takenoko.svg)"></i></div><div class="sq"></div>
        <div class="sq"></div><div class="sq"><i style="background-image:url(/assets/takenoko.svg)"></i></div><div class="sq"><i style="background-image:url(/assets/kinoko.svg)"></i></div><div class="sq"></div>
      </div>
      <div class="body">
        <h2>きのこ vs たけのこ</h2>
        <p>きのこ派とたけのこ派が戦うリバーシ。追加ルールを選んで、毎回ちがう対局を楽しめます。</p>
        <div class="tags"><span>派閥の必殺技</span><span>特殊マス</span><span>6×6〜10×10</span><span>テーマ曲</span></div>
        <span class="go">この盤で遊ぶ →</span>
      </div>
    </a>
  </div>
  <footer>© 2026 リバーシ遊技場</footer>
</main>
</body>
</html>
